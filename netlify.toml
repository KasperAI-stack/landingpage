[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Adresser uden .html. Netlify viser /privatlivspolitik ud fra privatlivspolitik.html af sig selv,
# og de gamle adresser med .html sendes videre, så ingen links går i stykker.
[[redirects]]
  from = "/privatlivspolitik.html"
  to = "/privatlivspolitik"
  status = 301
  force = true

[[redirects]]
  from = "/vilkaar.html"
  to = "/vilkaar"
  status = 301
  force = true

[[redirects]]
  from = "/tak.html"
  to = "/tak"
  status = 301
  force = true
