  <!-- Denne side er lavet af scripts/byg-blog.mjs. Ret i blog/ eller templates/, ikke her. -->
  <!-- Samtykke: alt starter som "nej", indtil et cookiebanner giver samtykke -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      functionality_storage: 'granted',
      security_storage: 'granted',
      wait_for_update: 1500
    });
  </script>
  <!-- Google tag (GA4 og Google Ads) og CookieScript hentes først ved første scroll, klik, tast eller tryk eller 4 sekunder efter load, så de ikke sinker siden. Hændelser venter i dataLayer, til gtag er hentet. Erstatter Google Tag Manager. -->
  <script>
  gtag('js', new Date());
  gtag('config', 'G-YRFWXEXL8G');
  gtag('config', 'AW-18496147052');
  (function(w,d){var done=0,ev=['scroll','pointerdown','keydown','touchstart'];
  function add(s){var j=d.createElement('script');j.async=true;j.src=s;d.head.appendChild(j);}
  function load(){if(done)return;done=1;ev.forEach(function(e){w.removeEventListener(e,load);});
  add('https://cdn.cookie-script.com/s/dde4e3943534fc857bebb2ec9cbcad4d.js');
  add('https://www.googletagmanager.com/gtag/js?id=G-YRFWXEXL8G');}
  w.hoTrack=load;
  ev.forEach(function(e){w.addEventListener(e,load,{passive:true});});
  function later(){setTimeout(load,4000);}
  if(d.readyState==='complete')later();else w.addEventListener('load',later);
  })(window,document);
  </script>
  <!-- Meta Pixel: kører først, når den besøgende har givet samtykke til marketing (targeting) i CookieScript -->
  <script type="text/plain" data-cookiescript="accepted" data-cookiecategory="targeting">
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1616440676548347');
  fbq('track', 'PageView');
  </script>
  <!-- End Meta Pixel -->
